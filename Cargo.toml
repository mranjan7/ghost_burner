[package]
name = "ghost-burner"
version = "0.1.0"
edition = "2024"
[[bin]]
name = "ghost"
path = "src/ghost_burner.rs"

[dependencies]
clap = {version="4.5", features = ["derive"]}
solana-client = "2.1"
solana-sdk = "2.1"
solana-account-decoder = "2.1"
spl-token = "5.0"
spl-associated-token-account = "4.0"
reqwest = {version = "0.12",features = ["blocking","json"]}
base64 = "0.22"
bincode = "1.3"
serde_json = "1.0"
chrono = "0.4"
jupiter-swap-api-client = "0.2.0"
serde = { version = "1.0.228", features = ["derive"] }