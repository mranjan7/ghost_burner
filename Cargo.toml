[package]
name = "ghost-burner"
version = "0.1.0"
edition = "2024"
[[bin]]
name = "ghost"
path = "src/ghost_burner.rs"

[dependencies]
clap = {version="4.5", features = ["derive"]}
solana-client = { version = "2.1", default-features = false }
solana-sdk =  { version = "2.1", default-features = false }
solana-account-decoder = { version = "2.1", default-features = false }
solana-cli-config = { version = "2.1", default-features = false }
spl-token = {version =  "5.0", default-features = false, features = ["no-entrypoint"] }
spl-associated-token-account = { version = "4.0", default-features = false, features = ["no-entrypoint"] }
reqwest = {version = "0.12",features = ["blocking","json"]}
base64 = "0.22"
bincode = "1.3"
serde_json = "1.0"
serde = { version = "1.0.228", features = ["derive"] }

